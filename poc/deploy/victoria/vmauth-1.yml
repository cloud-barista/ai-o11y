# vmauth-1: prefers vmagent-1 for writes and storage A for queries, and
# moves to the other when that one is down.
unauthorized_user:
  url_map:
    - src_paths: ["/opentelemetry/.*", "/api/v1/write"]
      url_prefix:
        - http://vmagent-1:8429
        - http://vmagent-2:8429
      load_balancing_policy: first_available
    - src_paths: ["/api/v1/.*"]
      url_prefix:
        - http://vm-a:8428
        - http://vm-b:8428
      load_balancing_policy: first_available
