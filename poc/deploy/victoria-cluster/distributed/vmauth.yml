# Writes go to this VM's vminsert, queries to this VM's vmselect; each moves
# to another VM's while this one's is down. Two accounts: the writer may only
# write (collectors), the reader may only query (ai-o11y). %{...} is filled
# from vmauth's environment.
# The paths ai-o11y and collectors use are those of single-node
# VictoriaMetrics; the url_prefix adds the cluster's tenant path (tenant 0).
users:
  - username: "%{VMAUTH_WRITER_USERNAME}"
    password: "%{VMAUTH_WRITER_PASSWORD}"
    url_map:
      - src_paths: ["/opentelemetry/.*"]
        url_prefix:
          - http://%{SELF_ADDR}:8480/insert/0
          - http://%{VM1_ADDR}:8480/insert/0
          - http://%{VM2_ADDR}:8480/insert/0
          - http://%{VM3_ADDR}:8480/insert/0
        load_balancing_policy: first_available
      - src_paths: ["/api/v1/write"]
        url_prefix:
          - http://%{SELF_ADDR}:8480/insert/0/prometheus
          - http://%{VM1_ADDR}:8480/insert/0/prometheus
          - http://%{VM2_ADDR}:8480/insert/0/prometheus
          - http://%{VM3_ADDR}:8480/insert/0/prometheus
        load_balancing_policy: first_available
  - username: "%{VMAUTH_READER_USERNAME}"
    password: "%{VMAUTH_READER_PASSWORD}"
    url_map:
      - src_paths: ["/api/v1/query", "/api/v1/query_range", "/api/v1/series", "/api/v1/labels", "/api/v1/label/.+/values"]
        url_prefix:
          - http://%{SELF_ADDR}:8481/select/0/prometheus
          - http://%{VM1_ADDR}:8481/select/0/prometheus
          - http://%{VM2_ADDR}:8481/select/0/prometheus
          - http://%{VM3_ADDR}:8481/select/0/prometheus
        load_balancing_policy: first_available
