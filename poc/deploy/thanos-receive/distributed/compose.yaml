# One VM's part of the Thanos Receive setup spread over three VMs, with the
# SeaweedFS cluster of storage/seaweedfs/distributed. Every VM runs a Receive;
# COMPOSE_PROFILES adds a Querier and a Store Gateway ("query", VM1 and VM2)
# and the one Compactor ("compact", VM1). Every VM runs this same file with its
# own .env (../README.md).
#
# Host networking: each part listens on SELF_ADDR, the VM's own address, which
# the other VMs reach it at. Ports in ../README.md.
#
# ai-o11y settings for this setup:
#   AIO11Y_BACKEND_PROVIDER=thanos
#   AIO11Y_BACKEND_QUERY_URL=http://<VM1>:10904,http://<VM2>:10904
#   AIO11Y_BACKEND_WRITE_URL=http://<VM1>:19291/api/v1/otlp,http://<VM2>:19291/api/v1/otlp,http://<VM3>:19291/api/v1/otlp
name: aio11y-thanos-receive

# The object storage, started with this file. It reads its settings from this
# directory's .env too, so they are set once.
include:
  - path: ../../storage/seaweedfs/distributed/compose.yaml
    env_file: .env

x-thanos: &thanos
  image: quay.io/thanos/thanos:${THANOS_VERSION}
  restart: unless-stopped
  network_mode: host
  depends_on: [thanos-data]

# This VM's filer, through which the Thanos parts here read and write blocks.
x-objstore: &objstore '--objstore.config={type: S3, config: {bucket: "${S3_BUCKET}", endpoint: "${SELF_ADDR}:8333", insecure: true, access_key: "${S3_ACCESS_KEY}", secret_key: "${S3_SECRET_KEY}"}}'

services:
  # Thanos runs as uid 1001 and the data volumes start owned by root; this
  # hands them over once, before the Thanos services start.
  thanos-data:
    image: quay.io/thanos/thanos:${THANOS_VERSION}
    user: root
    entrypoint: [chown, "1001:1001", /receive, /store, /compact]
    volumes: [receive:/receive, store:/store, compact:/compact]

  # Stores the series the hashring gives it and forwards the rest, keeping
  # RECEIVE_REPLICATION_FACTOR copies of every sample, and uploads a block every
  # 2 hours. receive_replica tells the copies apart; the Querier merges them.
  receive:
    <<: *thanos
    command:
      - receive
      - --tsdb.path=/data
      - --tsdb.retention=${RECEIVE_RETENTION}
      # Collectors send at their own times, so a late sample is not rejected.
      - --tsdb.out-of-order.time-window=10m
      - --grpc-address=${SELF_ADDR}:10901
      - --http-address=${SELF_ADDR}:10902
      - --remote-write.address=${SELF_ADDR}:19291
      - --receive.capnproto-address=${SELF_ADDR}:19391
      - '--receive.hashrings=[{"hashring": "default", "endpoints": ["${VM1_ADDR}:10901", "${VM2_ADDR}:10901", "${VM3_ADDR}:10901"]}]'
      - --receive.hashrings-algorithm=ketama
      - --receive.replication-factor=${RECEIVE_REPLICATION_FACTOR}
      - --receive.local-endpoint=${SELF_ADDR}:10901
      - --label=receive_replica="${SELF_ADDR}"
      - *objstore
    volumes: [receive:/data]

  # Serves the blocks in the bucket to the Queriers.
  store:
    <<: *thanos
    profiles: [query]
    command:
      - store
      - --data-dir=/data
      - --grpc-address=${SELF_ADDR}:10905
      - --http-address=${SELF_ADDR}:10906
      - *objstore
    volumes: [store:/data]

  # Recent samples from every Receive, older blocks from both Store Gateways;
  # the copies differ only in receive_replica, which it deduplicates on.
  query:
    <<: *thanos
    profiles: [query]
    command:
      - query
      - --grpc-address=${SELF_ADDR}:10903
      - --http-address=${SELF_ADDR}:10904
      - --endpoint=${VM1_ADDR}:10901
      - --endpoint=${VM2_ADDR}:10901
      - --endpoint=${VM3_ADDR}:10901
      - --endpoint=${VM1_ADDR}:10905
      - --endpoint=${VM2_ADDR}:10905
      - --query.replica-label=receive_replica

  # Compacts and downsamples the bucket and applies its retention. One per
  # bucket only: a second would compact the same blocks twice.
  compact:
    <<: *thanos
    profiles: [compact]
    command:
      - compact
      - --wait
      - --data-dir=/data
      - --http-address=${SELF_ADDR}:10912
      - --retention.resolution-raw=${COMPACT_RETENTION_RAW}
      - --retention.resolution-5m=${COMPACT_RETENTION_5M}
      - --retention.resolution-1h=${COMPACT_RETENTION_1H}
      - *objstore
    volumes: [compact:/data]

volumes:
  receive:
  store:
  compact:
