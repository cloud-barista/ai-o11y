# The components of the ai-o11y collector, built with the OpenTelemetry
# Collector Builder (ocb): exactly what the configuration ai-o11y renders
# (internal/monitoring/collector) uses. Add a component here when the renderer
# starts using it; `make validate` checks the rendered configuration against
# this build.
dist:
  name: aio11y-otelcol
  description: ai-o11y monitoring agent
  version: 0.1.0
  output_path: ./_build

receivers:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/hostmetricsreceiver v0.164.1
processors:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/attributesprocessor v0.164.1
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.164.0
exporters:
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.164.0
