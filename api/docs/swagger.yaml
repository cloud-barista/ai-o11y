basePath: /aio11y
definitions:
  model.AttributeInfo:
    properties:
      name:
        example: cpu.mode
        type: string
      values:
        items:
          type: string
        type: array
    type: object
  model.MetricInfo:
    properties:
      area:
        example: cpu
        type: string
      attribute:
        allOf:
        - $ref: '#/definitions/model.AttributeInfo'
        description: 'Attribute splits the field: a query names it in where or splitBy.'
      description:
        example: Share of CPU time in each cpu.mode. Without one, the share not idle.
        type: string
      dimension:
        description: |-
          Dimension is the attribute that splits the field within a target, such
          as system.device.name; within collapses it.
        example: ""
        type: string
      gap:
        example: ""
        type: string
      kind:
        enum:
        - gauge
        - rate
        - info
        example: rate
        type: string
      name:
        example: system.cpu.utilization
        type: string
      requires:
        description: Requires lists what a target needs to have the field, such as
          "os:linux".
        items:
          type: string
        type: array
      schema:
        description: Schema is empty for a common field and names the collector otherwise.
        example: ""
        type: string
      supported:
        description: Supported is false when no collector provides the field yet;
          Gap says why.
        example: true
        type: boolean
      unit:
        example: "1"
        type: string
      zeroFill:
        description: ZeroFill is true when a query can take a missing value as 0 (fillZero).
        example: false
        type: boolean
    type: object
  model.MetricListResp:
    properties:
      metrics:
        items:
          $ref: '#/definitions/model.MetricInfo'
        type: array
    type: object
  model.PointInfo:
    properties:
      t:
        type: string
      v:
        type: number
    type: object
  model.QueryReq:
    properties:
      across:
        description: Across combines the targets with fn, keeping the groupBy attributes.
        example: ""
        type: string
      end:
        type: string
      fillZero:
        description: |-
          FillZero takes a missing value as 0 for a metric whose collector does
          not send zeros (MetricInfo.zeroFill), for targets otherwise reporting.
        example: false
        type: boolean
      groupBy:
        items:
          type: string
        type: array
      metric:
        description: |-
          Metric and Schema name the catalog field (see GET /metrics); Schema is
          empty for a common field.
        example: system.cpu.utilization
        type: string
      schema:
        example: ""
        type: string
      selector:
        additionalProperties:
          type: string
        type: object
      splitBy:
        items:
          type: string
        type: array
      start:
        type: string
      step:
        description: |-
          Step makes a graph from start to end; empty asks for one value at end
          (now when end is empty).
        example: 1m
        type: string
      targetIds:
        items:
          type: string
        type: array
      topK:
        $ref: '#/definitions/model.TopKReq'
      where:
        additionalProperties:
          type: string
        description: |-
          Where keeps the value of the field's attribute, such as
          {"cpu.mode": "user"}; SplitBy gives one series per value of it, such as
          ["cpu.mode"]. Without either the field answers its default value.
        type: object
      windowFn:
        description: |-
          Window aggregates each series over the last windowRange with
          windowFn: avg, min, max, sum, count or last.
        example: ""
        type: string
      windowRange:
        example: ""
        type: string
      within:
        description: |-
          Within collapses the field's dimension (devices, mount points) inside
          each target with fn: avg, min, max, sum or count.
        example: ""
        type: string
    type: object
  model.QueryResp:
    properties:
      series:
        items:
          $ref: '#/definitions/model.SeriesInfo'
        type: array
      targets:
        additionalProperties:
          $ref: '#/definitions/model.TargetInfo'
        description: Targets describes, by id, the targets the series carry an entity_id
          of.
        type: object
    type: object
  model.SeriesInfo:
    properties:
      labels:
        additionalProperties:
          type: string
        description: |-
          Labels are entity_id and the attributes the series is split by, by
          their OpenTelemetry names.
        type: object
      points:
        items:
          $ref: '#/definitions/model.PointInfo'
        type: array
    type: object
  model.SimpleMsg:
    properties:
      message:
        example: Service is ready
        type: string
    type: object
  model.TargetInfo:
    properties:
      attributes:
        additionalProperties:
          type: string
        description: Attributes are the platform attributes, such as nsId, infraId
          and nodeId.
        type: object
      gpuCount:
        example: 1
        type: integer
      gpuModel:
        example: NVIDIA T4
        type: string
      id:
        description: |-
          ID is the target's key: the management platform's own key for it, the
          CB-Tumblebug node Uid, and the entity_id its series carry.
        example: d44ikdomt0tac4ejrmmg
        type: string
      kind:
        example: vm
        type: string
      name:
        example: web-1
        type: string
      os:
        example: linux
        type: string
      provider:
        example: aws
        type: string
      region:
        example: ap-northeast-2
        type: string
    type: object
  model.TargetListResp:
    properties:
      targets:
        items:
          $ref: '#/definitions/model.TargetInfo'
        type: array
    type: object
  model.TargetMetricInfo:
    properties:
      area:
        example: cpu
        type: string
      attribute:
        $ref: '#/definitions/model.AttributeInfo'
      dimension:
        example: ""
        type: string
      name:
        example: system.cpu.utilization
        type: string
      reason:
        example: ""
        type: string
      schema:
        example: ""
        type: string
      supported:
        description: Supported is whether the target has the field; Reason says why
          not.
        example: true
        type: boolean
      unit:
        example: "1"
        type: string
    type: object
  model.TargetMetricListResp:
    properties:
      metrics:
        items:
          $ref: '#/definitions/model.TargetMetricInfo'
        type: array
      targetId:
        example: d44ikdomt0tac4ejrmmg
        type: string
    type: object
  model.TargetReq:
    properties:
      attributes:
        additionalProperties:
          type: string
        description: Attributes are further platform attributes to select the target
          by.
        type: object
      gpuCount:
        example: 1
        type: integer
      gpuModel:
        example: NVIDIA T4
        type: string
      infraId:
        example: infra01
        type: string
      kind:
        description: Kind is "node". "k8s" is reserved and refused with 422.
        enum:
        - node
        - k8s
        example: node
        type: string
      name:
        example: web-1
        type: string
      nodeId:
        example: node01
        type: string
      nsId:
        example: ns01
        type: string
      os:
        description: OS is "linux", "windows" or empty when unknown.
        enum:
        - linux
        - windows
        example: linux
        type: string
      provider:
        example: aws
        type: string
      region:
        example: ap-northeast-2
        type: string
      uid:
        description: Uid is the CB-Tumblebug node Uid, the target's key.
        example: d44ikdomt0tac4ejrmmg
        type: string
    type: object
  model.TargetSyncResp:
    properties:
      deleted:
        description: Deleted targets were confirmed gone by the platform.
        items:
          type: string
        type: array
      kept:
        additionalProperties:
          type: string
        description: |-
          Kept targets were missing from the listing but not confirmed gone, with
          the reason.
        type: object
      updated:
        description: Updated targets were described again as the platform lists them.
        items:
          type: string
        type: array
    type: object
  model.TopKReq:
    properties:
      desc:
        example: true
        type: boolean
      "n":
        example: 5
        type: integer
      perLabel:
        example: ""
        type: string
    type: object
info:
  contact: {}
  description: 'Monitoring control plane for AI-MCMP: monitoring targets, collector
    configuration and metric queries over a Prometheus-family backend.'
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: AI-MCMP AI-O11y Service (Prototype)
  version: 0.1.0
paths:
  /metrics:
    get:
      description: 'List the metric catalog: the common fields, named and meant as
        OpenTelemetry names them, and the fields of one collector''s own, each with
        the attribute that splits it and, for a field no collector provides yet, the
        reason.'
      operationId: GetAllMetrics
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.MetricListResp'
      summary: List metrics
      tags:
      - '[Monitoring] Metrics'
  /query:
    post:
      consumes:
      - application/json
      description: Query one metric over targets named by id or selected by their
        attributes, as one value per series or as a graph from start to end. The answer
        carries the series and the targets they belong to.
      operationId: PostQuery
      parameters:
      - description: Query
        in: body
        name: queryReq
        required: true
        schema:
          $ref: '#/definitions/model.QueryReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.QueryResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "404":
          description: Unknown metric or target
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "422":
          description: Metric is not supported
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "502":
          description: The metrics backend did not answer
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      summary: Query a metric
      tags:
      - '[Monitoring] Metrics'
  /readyz:
    get:
      description: Report whether the service finished initialization and can accept
        requests
      operationId: GetReadyz
      produces:
      - application/json
      responses:
        "200":
          description: Service is ready
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "503":
          description: Service is still initializing
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      summary: Check service readiness
      tags:
      - '[Health] Service Health'
  /targets:
    get:
      description: 'List the registered targets. Every query parameter is a condition
        on an attribute, all of which must match exactly: a common field (kind, name,
        provider, region, os, gpuCount, gpuModel) or a platform attribute such as
        nsId, infraId or nodeId.'
      operationId: GetAllTargets
      parameters:
      - description: CB-Tumblebug namespace
        in: query
        name: nsId
        type: string
      - description: CB-Tumblebug Infra
        in: query
        name: infraId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.TargetListResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      summary: List targets
      tags:
      - '[Monitoring] Targets'
    post:
      consumes:
      - application/json
      description: Register a target when its agent is installed. The body names the
        node as ai-app names a deployment target and carries its description from
        CB-Tumblebug; without uid the description is read from CB-Tumblebug. Registering
        a target again replaces its description.
      operationId: PostTarget
      parameters:
      - description: Target to register
        in: body
        name: targetReq
        required: true
        schema:
          $ref: '#/definitions/model.TargetReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.TargetInfo'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "404":
          description: The node is not in CB-Tumblebug
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "422":
          description: Kind is not supported
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "502":
          description: CB-Tumblebug did not answer
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      summary: Register a target
      tags:
      - '[Monitoring] Targets'
  /targets/{targetId}:
    delete:
      description: Delete a registered target, as when its agent is removed. Its stored
        series stay in the backend.
      operationId: DeleteTarget
      parameters:
      - description: Target id (CB-Tumblebug node Uid)
        in: path
        name: targetId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      summary: Delete a target
      tags:
      - '[Monitoring] Targets'
    get:
      description: Get one registered target by its id.
      operationId: GetTarget
      parameters:
      - description: Target id (CB-Tumblebug node Uid)
        in: path
        name: targetId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.TargetInfo'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      summary: Get a target
      tags:
      - '[Monitoring] Targets'
  /targets/{targetId}/collectorConfig:
    get:
      description: 'Render the OpenTelemetry Collector configuration the target''s
        agent runs: the collectors that apply to it, its entity_id stamped on every
        series, and the metrics backend to send them to.'
      operationId: GetTargetCollectorConfig
      parameters:
      - description: Target id (CB-Tumblebug node Uid)
        in: path
        name: targetId
        required: true
        type: string
      produces:
      - application/yaml
      responses:
        "200":
          description: Collector configuration (YAML)
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      summary: Get a target's collector configuration
      tags:
      - '[Monitoring] Targets'
  /targets/{targetId}/metrics:
    get:
      description: 'List the metric catalog as it stands for one target: which fields
        it has, from the collectors that run on it, and which it does not, with the
        reason.'
      operationId: GetTargetMetrics
      parameters:
      - description: Target id (CB-Tumblebug node Uid)
        in: path
        name: targetId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.TargetMetricListResp'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      summary: List a target's metrics
      tags:
      - '[Monitoring] Metrics'
  /targets/sync:
    post:
      description: 'Bring the target table in step with CB-Tumblebug: describe every
        listed target again, and delete a target missing from the listing only when
        CB-Tumblebug answers that it is gone. Targets are never added here; they are
        registered at agent install. If the listing fails, nothing changes.'
      operationId: PostTargetSync
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.TargetSyncResp'
        "409":
          description: A sync is already running
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "502":
          description: The management platform could not be listed; nothing changed
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      summary: Sync targets with the management platform
      tags:
      - '[Monitoring] Targets'
securityDefinitions:
  BearerAuth:
    description: '"Bearer <token>". Required on every route but readiness and this
      documentation when AIO11Y_AUTH_TOKEN is set.'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
