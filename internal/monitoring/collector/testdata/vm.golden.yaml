exporters:
    otlp_http:
        endpoint: http://prometheus:9090/api/v1/otlp
processors:
    attributes/identity:
        actions:
            - action: upsert
              key: entity_id
              value: d44ikdomt0tac4ejrmmg
    batch: {}
receivers:
    host_metrics:
        collection_interval: 30s
        scrapers:
            cpu:
                metrics:
                    system.cpu.physical.count:
                        enabled: true
            disk: {}
            filesystem: {}
            load: {}
            memory:
                metrics:
                    system.linux.memory.available:
                        enabled: true
                    system.memory.limit:
                        enabled: true
                    system.memory.linux.shared:
                        enabled: true
                    system.memory.utilization:
                        enabled: true
            network: {}
            paging: {}
            processes: {}
            system: {}
service:
    pipelines:
        metrics:
            exporters:
                - otlp_http
            processors:
                - attributes/identity
                - batch
            receivers:
                - host_metrics
    telemetry:
        metrics:
            level: none
