# Writes go to the vminserts, queries to the vmselects, each to the first one
# that is up. Two accounts: the writer may only write (collectors), the reader
# may only query (ai-o11y). %{...} is filled from vmauth's environment.
# The paths ai-o11y and collectors use are those of single-node
# VictoriaMetrics; the url_prefix adds the cluster's tenant path (tenant 0).
users:
  - username: "%{VMAUTH_WRITER_USERNAME}"
    password: "%{VMAUTH_WRITER_PASSWORD}"
    url_map:
      - src_paths: ["/opentelemetry/.*"]
        url_prefix:
          - http://vminsert-1:8480/insert/0
          - http://vminsert-2:8480/insert/0
        load_balancing_policy: first_available
      - src_paths: ["/api/v1/write"]
        url_prefix:
          - http://vminsert-1:8480/insert/0/prometheus
          - http://vminsert-2:8480/insert/0/prometheus
        load_balancing_policy: first_available
  - username: "%{VMAUTH_READER_USERNAME}"
    password: "%{VMAUTH_READER_PASSWORD}"
    url_map:
      - src_paths: ["/api/v1/query", "/api/v1/query_range", "/api/v1/series", "/api/v1/labels", "/api/v1/label/.+/values"]
        url_prefix:
          - http://vmselect-1:8481/select/0/prometheus
          - http://vmselect-2:8481/select/0/prometheus
        load_balancing_policy: first_available
